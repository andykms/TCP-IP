@for (i of configurations(); track $index) {
  <hercules-tcp-client-configuration
    [canRemoveConfiguration]="$index > 0"
    (addConfiguration)="onAddConfiguration()"
    (removeConfiguration)="onRemoveConfiguration()"
    [canAddConfiguration]="$index >= configurations().length - 1"
  >
  </hercules-tcp-client-configuration>
}
<hercules-data-center
  [messages]="messages()"
  [ips]="ips()"
  [ports]="ports()"
  [connectionIds]="connectionIds()"
  (sendMessage)="onSendMessage($event)"
  [messageStatus]="messageStatus()"
></hercules-data-center>
